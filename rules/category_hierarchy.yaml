# Category hierarchy: the one category list the Cashew sheet and Cashew App share.
#
# Groups (parents) follow the owner's Monarch Money groups (Travel and Lifestyle
# split apart, 2026-09-27); the
# subcategory names are shorter labels for Monarch's categories (rules.yaml
# translates Monarch's names into these). Every assign_category in rules.yaml
# and every category the app can show must be listed here.
#
# Per parent: emoji, type (expense | income | investment | exclude) and
# subcategories (in display order). `control` (below) says how much say the
# owner has over each expense subcategory.
# Reorder, rename or move subcategories here; rules.yaml must follow a rename.

hierarchy:
  Food & Drinks:
    emoji: "🍽️"
    type: expense
    subcategories:
      - Groceries
      - Restaurants & Alcohol
      - Coffee Shops

  Shopping:
    emoji: "🛍️"
    type: expense
    subcategories:
      - Shopping
      - Clothing
      - Electronics
      - Furniture
      - Shipping
      - Vape & Nashe

  Lifestyle:
    emoji: "🎭"
    type: expense
    subcategories:
      - Entertainment
      - Gifts
      - Personal
      - Charity

  # Trips: getting there and staying (flights, hotels, events and tickets on
  # the trip) versus eating and drinking out on it.
  Travel & Vacation:
    emoji: "✈️"
    type: expense
    subcategories:
      - Travel Logistics
      - Travel Food & Drinks

  Auto & Transport:
    emoji: "🚗"
    type: expense
    subcategories:
      - Gas
      - Auto Maintenance
      - Auto Payment
      - Parking & Tolls
      - Public Transit
      - Rideshare

  Housing:
    emoji: "🏠"
    type: expense
    subcategories:
      - Rent
      - Home Improvement

  Bills & Utilities:
    emoji: "📱"
    type: expense
    subcategories:
      - Electricity
      - Phone
      - Internet
      - Water
      - Garbage

  Health & Wellness:
    emoji: "💊"
    type: expense
    subcategories:
      - Medical
      - Dentist
      - Fitness

  Financial:
    emoji: "🏦"
    type: expense
    subcategories:
      - Insurance
      - Fees
      - Financial Services
      - Taxes
      - Cash & ATM
      - Loan Repayment
      - Student Loans

  Other:
    emoji: "❓"
    type: expense
    subcategories:
      - Uncategorized
      - Miscellaneous

  Income:
    emoji: "💰"
    type: income
    subcategories:
      - Paycheck
      - Business Income
      - Other Income

  # Eva's college and AI subscriptions: money spent on growth, kept out of spend.
  Education:
    emoji: "🎓"
    type: investment
    subcategories:
      - Education

  Investment:
    emoji: "📈"
    type: investment
    subcategories:
      - Stocks
      - FDs
      - India Transfer

  # Money moving between own accounts; never counted as spend or income.
  Transfers:
    emoji: "🔁"
    type: exclude
    subcategories:
      - Transfer
      - Credit Card Payment
      - Balance Adjustments

# How much say the owner has over each expense subcategory (every expense
# subcategory has one):
#   fixed         the same every month; can't change it this month (rent, bills)
#   essential     needed but irregular; not something to cut (gifts, medical,
#                 travel logistics)
#   controllable  can be brought down (shopping, restaurants & alcohol)
# The app's monthly target covers everything but fixed.
control:
  Groceries: essential
  Restaurants & Alcohol: controllable
  Coffee Shops: controllable
  Shopping: controllable
  Clothing: controllable
  Electronics: controllable
  Furniture: controllable
  Shipping: controllable
  Vape & Nashe: controllable
  Entertainment: controllable
  Gifts: essential
  Personal: essential
  Charity: essential
  Travel Logistics: essential
  Travel Food & Drinks: controllable
  Gas: essential
  Auto Maintenance: essential
  Auto Payment: fixed
  Parking & Tolls: controllable
  Public Transit: essential
  Rideshare: controllable
  Rent: fixed
  Home Improvement: essential
  Electricity: fixed
  Phone: fixed
  Internet: fixed
  Water: fixed
  Garbage: fixed
  Medical: essential
  Dentist: essential
  Fitness: fixed
  Insurance: fixed
  Fees: controllable
  Financial Services: essential
  Taxes: essential
  Cash & ATM: controllable
  Loan Repayment: fixed
  Student Loans: fixed
  Uncategorized: controllable
  Miscellaneous: controllable

