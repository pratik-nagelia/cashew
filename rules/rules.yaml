# Pratik's categorization rules for expense-planner
# Rules evaluated: hidden → investment → exclude → remittance → income → expense override → default
# First match wins within each section.
#
# Last updated: 2026-09-27 (Monarch groups with short labels; see category_hierarchy.yaml)

# --- Exclusions (internal transfers, double-counting) ---
exclude_rules:
  - match_field: category
    pattern: "Transfer"
    match_mode: exact
    note: "Internal transfers between own accounts (fills CC payments etc)"

  - match_field: category
    pattern: "Credit Card Payment"
    match_mode: contains
    note: "CC payments are not real expenses (already counted on the CC)"

  - match_field: category
    pattern: "Balance Adjustments"
    match_mode: exact
    note: "Monarch's manual balance corrections, not money moving"

# --- Investments (tracked separately — not expenses) ---
investment_rules:
  - match_field: category
    pattern: "India Transfer"
    match_mode: exact
    assign_category: "India Transfer"

  - match_field: merchant
    pattern: "Robinhood"
    match_mode: contains
    assign_category: "Stocks"

  # Interest earned on savings/CDs — not salary income
  - match_field: category
    pattern: "Interest"
    match_mode: exact
    assign_category: "FDs"

  # CD maturity deposits
  - match_field: plaid_name
    pattern: "Deposit from CD"
    match_mode: contains
    assign_category: "FDs"

  - match_field: plaid_name
    pattern: "Certificate of Deposit"
    match_mode: contains
    assign_category: "FDs"

  - match_field: merchant
    pattern: "Certificate of Deposit"
    match_mode: contains
    assign_category: "FDs"

  # Schwab brokerage transfers — investment movements, not income
  - match_field: plaid_name
    pattern: "SCHWAB BROKERAGE"
    match_mode: contains
    assign_category: "Stocks"

  # Monarch's own Investment-group categories
  - match_field: category
    pattern: "Stocks"
    match_mode: exact
    assign_category: "Stocks"

  - match_field: category
    pattern: "FDs"
    match_mode: exact
    assign_category: "FDs"

  # Catch-all: Monarch's own "Investment" category (e.g. CD deposits)
  - match_field: category
    pattern: "Investment"
    match_mode: exact
    assign_category: "FDs"

  # Education — tracked as investment (Eva's college), not day-to-day expense
  - match_field: category
    pattern: "Education"
    match_mode: exact
    assign_category: "Education"

  - match_field: category
    pattern: "Eva College"
    match_mode: exact
    assign_category: "Education"

# --- Remittances (real outflows, tracked separately from expenses) ---
remittance_rules: []

# --- Income ---
income_rules:
  - match_field: category
    pattern: "Paychecks"
    match_mode: exact
    assign_category: "Paycheck"

  - match_field: category
    pattern: "Other Income"
    match_mode: exact
    assign_category: "Other Income"

  - match_field: category
    pattern: "Business Income"
    match_mode: exact
    assign_category: "Business Income"

# --- Expense category overrides ---
# Translate Monarch's category names (also what Cashew App maps Plaid's
# categories to) into the shorter labels in category_hierarchy.yaml. A Monarch
# name that already matches a subcategory there (Groceries, Gas, Rent, Phone,
# Medical, Charity...) needs no rule: the default keeps it.
expense_overrides:
  - match_field: category
    pattern: "Restaurants & Bars"
    match_mode: exact
    assign_category: "Restaurants & Alcohol"

  - match_field: category
    pattern: "Furniture & Housewares"
    match_mode: exact
    assign_category: "Furniture"

  - match_field: category
    pattern: "Postage & Shipping"
    match_mode: exact
    assign_category: "Shipping"

  - match_field: category
    pattern: "Travel & Vacation"
    match_mode: exact
    assign_category: "Travel Logistics"

  - match_field: category
    pattern: "Travel Food"
    match_mode: exact
    assign_category: "Travel Food & Drinks"

  - match_field: category
    pattern: "Entertainment & Recreation"
    match_mode: exact
    assign_category: "Entertainment"

  - match_field: category
    pattern: "Taxi & Ride Shares"
    match_mode: exact
    assign_category: "Rideshare"

  - match_field: category
    pattern: "Gas & Electric"
    match_mode: exact
    assign_category: "Electricity"

  - match_field: category
    pattern: "Internet & Cable"
    match_mode: exact
    assign_category: "Internet"

  - match_field: category
    pattern: "Financial Fees"
    match_mode: exact
    assign_category: "Fees"

  - match_field: category
    pattern: "Financial & Legal Services"
    match_mode: exact
    assign_category: "Financial Services"

  - match_field: category
    pattern: "Insurance"
    match_mode: contains
    assign_category: "Insurance"

  # Refunds keep their Monarch category: the positive amount nets against that
  # category's spend.

# --- Defaults ---
defaults:
  unmatched_type: expense
  unmatched_category_behavior: keep_original
